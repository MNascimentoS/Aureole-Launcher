build:
  maxIssues: 5
  excludeCorrectable: false
  weights:
  # complexity: 2
  # LongParameterList: 1
  # style: 1
  # comments: 1

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false
  excludes: ''

processors:
  active: true
  exclude:
    - 'DetektProgressListener'

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'

output-reports:
  active: true

comments:
  active: true
  UndocumentedPublicFunction:
    active: true
    includes: ['**/core/designsystem/components/**']
    ignoreAnnotated: ['Preview', 'AureolePreview']

formatting:
  active: true
  android: true
  autoCorrect: true

  # Regras específicas do KtLint
  Indentation:
    active: true
    indentSize: 4
  MaximumLineLength:
    active: true
    maxLineLength: 120
  SpacingAroundKeyword:
    active: true
  SpacingAroundColon:
    active: true
  NoTrailingSpaces:
    active: true
  NoEmptyClassBody:
    active: true
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false

style:
  ForbiddenComment:
    active: true
  ReturnCount:
    active: true
    excludeGuardClauses: true
  ForbiddenImport:
    active: true
    imports:
      - 'androidx.compose.material.icons.*'
      - 'androidx.compose.ui.tooling.preview.Preview'
    excludes: ['**/AureolePreview.kt']
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview', 'AureolePreview']

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']

complexity:
  active: true
  NestedBlockDepth:
    active: true
    threshold: 5
  LargeClass:
    active: true
    threshold: 300
    excludes: ['**/AureoleIcons.kt']
  LongMethod:
    active: true
    threshold: 60
  CyclomaticComplexMethod:
    active: true
    threshold: 15

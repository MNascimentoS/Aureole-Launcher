name: CI & Google Play Internal Deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'main'
      - 'master'
      - 'develop'
      - 'release/**'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 0.0.0)'
        required: false

jobs:
  # Roda em todo evento (PR, push em release/* e disparo manual): o deploy só acontece se os testes passarem.
  pr_check:
    name: PR Validation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run Unit Tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest

      # ---- Full Report (somente PR de release/*) ----
      # Tudo abaixo é informativo: continue-on-error + timeout, então o status do PR continua
      # dependendo só dos testes acima. Os arquivos viram o artefato full-report-<head sha>,
      # consumido pela análise do n8n (cobertura, testes, lint, detekt e APK release).
      - name: Full Report - Build, Coverage & Lint
        id: full_report
        if: ${{ !cancelled() && startsWith(github.head_ref, 'release/') }}
        continue-on-error: true
        timeout-minutes: 25
        run: >
          ./gradlew assembleRelease jacocoTestReport lintDebug detekt
          -x testDebugUnitTest --continue

      - name: Full Report - Metadata
        if: ${{ !cancelled() && startsWith(github.head_ref, 'release/') }}
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTS: ${{ steps.unit_tests.outcome }}
          REPORTS: ${{ steps.full_report.outcome }}
        run: |
          mkdir -p app/build/full-report
          jq -n --arg head_sha "$HEAD_SHA" --arg merge_sha "$GITHUB_SHA" --arg branch "$HEAD_REF" \
            --arg pr "$PR_NUMBER" --arg tests "$TESTS" --arg reports "$REPORTS" --arg run_id "$GITHUB_RUN_ID" \
            '{head_sha: $head_sha, merge_sha: $merge_sha, branch: $branch, pr: $pr, tests: $tests, reports: $reports, run_id: $run_id}' \
            > app/build/full-report/meta.json

      - name: Full Report - Upload
        if: ${{ !cancelled() && startsWith(github.head_ref, 'release/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: full-report-${{ github.event.pull_request.head.sha }}
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true
          path: |
            app/build/full-report/meta.json
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.xml
            app/build/reports/detekt/detekt.txt
            app/build/outputs/apk/release/*.apk

  deploy_internal:
    name: Build & Deploy Internal Release
    needs: pr_check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for git rev-list --count HEAD versionCode calculation

      - name: Extract Version Name from Branch Name
        id: extract_version
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          else
            BRANCH_NAME="${GITHUB_REF_NAME}"
            VERSION_NAME="${BRANCH_NAME#release/}"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "Extracted Version Name: ${VERSION_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Decode Android Release Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Create Google Play Service Account JSON
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          echo "$PLAY_STORE_JSON_KEY" > play_store_key.json

      - name: Run Fastlane Internal Lane
        env:
          PLAY_STORE_JSON_KEY_PATH: "play_store_key.json"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bundle exec fastlane internal version_name:"${{ steps.extract_version.outputs.VERSION_NAME }}"

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f release.keystore play_store_key.json

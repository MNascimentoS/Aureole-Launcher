name: CI & Google Play Internal Deploy

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'main'
      - 'master'
      - 'develop'
      - 'release/**'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 0.0.0)'
        required: false

jobs:
  pr_check:
    name: PR Validation Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

  deploy_internal:
    name: Build & Deploy Internal Release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for git rev-list --count HEAD versionCode calculation

      - name: Extract Version Name from Branch Name
        id: extract_version
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          else
            BRANCH_NAME="${GITHUB_REF_NAME}"
            VERSION_NAME="${BRANCH_NAME#release/}"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "Extracted Version Name: ${VERSION_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Decode Android Release Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Create Google Play Service Account JSON
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          echo "$PLAY_STORE_JSON_KEY" > play_store_key.json

      - name: Run Fastlane Internal Lane
        env:
          PLAY_STORE_JSON_KEY_PATH: "play_store_key.json"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bundle exec fastlane internal version_name:"${{ steps.extract_version.outputs.VERSION_NAME }}"

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f release.keystore play_store_key.json

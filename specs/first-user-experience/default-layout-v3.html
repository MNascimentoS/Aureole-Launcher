<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#12181D;--surface:#2B373E;--variant:#4A5D6B;--outline:#7D96AA;--low:#9BB4C8;--medium:#C5D8E8;--high:#fff}
body{margin:0;background:#0b1014;font-family:"Istok Web",Roboto,sans-serif;color:var(--medium);padding:24px}
.row{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}
.col h3{margin:0;color:var(--high);font-size:15px}.col small{color:var(--low);font-size:11px}
.phone{position:relative;background:linear-gradient(160deg,#12181D,#16232c 50%,#0e151a);border-radius:26px;box-shadow:0 0 0 6px #050709,0 0 0 7px #222c33;overflow:hidden}
.p{width:270px;height:585px}.l{width:585px;height:270px}
.grid{position:absolute;inset:26px 6px 14px}
.it{position:absolute;padding:4px;box-sizing:border-box}
.it>div{width:100%;height:100%;border-radius:14px;box-sizing:border-box;padding:8px 10px;font-size:10px;overflow:hidden}
.clock>div{background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.clock b{display:block;font-size:30px;line-height:1;margin:2px 0}
.wid>div{background:rgba(74,93,107,.35);border:1.5px dashed var(--outline);display:grid;place-items:center;text-align:center;color:var(--high)}
.apps>div{background:transparent;display:flex;flex-direction:column;gap:7px}
.appsL>div{display:flex;flex-direction:column;gap:7px;align-items:flex-end;text-align:right}.appsL i{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:middle;margin-left:7px}
.apps i{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:middle;margin-right:7px}
.cont>div{background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.cont span{width:22px;height:22px;border-radius:7px;background:var(--variant)}.cont span.plus{background:none;border:1.5px solid var(--medium);display:grid;place-items:center;color:var(--medium);font-size:14px}
.clockbg>div{background:rgba(43,55,62,.8);color:#fff}.clockbg b{display:block;font-size:30px;line-height:1;margin:2px 0}
.gap>div{border:1.5px dashed #c9636f;background:rgba(201,99,111,.08);display:grid;place-items:center;color:#e7a0a8}
.legend{max-width:820px;margin-top:22px;font-size:12.5px;line-height:1.5;color:var(--low)}
.legend b{color:var(--high)}
</style></head><body>
<div class="row" id="root"></div>
<div class="legend"><b>v3:</b> container mais estreito (4 colunas) e encostado na borda; lista de favoritos maior (16 colunas e 18 linhas no retrato, começando logo abaixo dos widgets); em paisagem o relógio fica com fundo e alinhado à esquerda.</div>
<script>
const apps=[["#2e7d32","Agenda"],["#1565c0","Câmera"],["#ef6c00","Mensagens"],["#0288d1","Navegador"],["#6a1b9a","Música"],["#00897b","Telefone"],["#c62828","Galeria"],["#455a64","Arquivos"]];
const html={clockbg:'<small>Boa tarde</small><b>9:41</b>quarta, 28 out',clock:'<small>Boa tarde</small><b>9:41</b>quarta, 28 out',wid:'＋<br>Adicionar widget',apps:apps.map(a=>`<span><i style="background:${a[0]}"></i>${a[1]}</span>`).join(''),appsL:apps.map(a=>`<span>${a[1]}<i style="background:${a[0]}"></i></span>`).join(''),cont:'<span></span><span></span><span></span><span class="plus">+</span>',gap:'espaço vazio'};
function phone(title,sub,cls,cols,rows,items){
 const c=document.createElement('div');c.className='col';
 c.innerHTML=`<h3>${title}</h3><small>${sub}</small><div class="phone ${cls}"><div class="grid"></div></div>`;
 const g=c.querySelector('.grid');
 items.forEach(([t,col,row,cs,rs])=>{const d=document.createElement('div');d.className='it '+t;
 Object.assign(d.style,{left:col/cols*100+'%',top:row/rows*100+'%',width:cs/cols*100+'%',height:rs/rows*100+'%'});d.innerHTML='<div>'+html[t]+'</div>';g.appendChild(d)});
 document.getElementById('root').appendChild(c)}
phone('Proposto v3','retrato','p',20,30,[['clock',0,0,20,6],['wid',0,6,20,6],['apps',0,12,16,18],['cont',16,12,4,18]]);
phone('Proposto v3 · canhoto','retrato','p',20,30,[['clock',0,0,20,6],['wid',0,6,20,6],['cont',0,12,4,18],['appsL',4,12,16,18]]);
phone('Proposto v3','paisagem','l',30,20,[['clockbg',0,0,14,7],['apps',0,7,14,13],['wid',14,0,12,20],['cont',26,0,4,20]]);
</script></body></html>

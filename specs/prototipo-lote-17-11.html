var render=function(){

 document.getElementById('tabs').innerHTML=Object.entries(V2).map(([k,x])=>`<button data-v="${k}" class="${k===cur?'on':''}">${x.label}</button>`).join('');
 document.getElementById('subs').innerHTML=v.sub?v.sub.map((s,i)=>`<button data-sub="${i}" class="${i===sub?'on':''}">${s}</button>`).join('')+(cur!=='fav'?'':`<span class="legend" style="align-self:center">Teste: <button class="btn" data-fav="0">0 favoritos</button> <button class="btn" data-fav="3">3 favoritos</button></span>`):'';
 document.getElementById('desc').innerHTML=v.descs?v.descs[sub]:v.desc;
 document.getElementById('row').innerHTML=v.phones().map(p=>phone(p[0],p[1],p[2])).join('');
 if(cur==='onb'){playVitrine();playPeek()}
}
function playVitrine(){
 const s=document.getElementById('vit'),r=document.querySelector('#vit-ring .arc'),c=document.getElementById('vit-coach');
 if(!s) return; s.classList.remove('down'); const L=r.getAttribute('stroke-dasharray'); r.style.transition='none'; r.style.strokeDashoffset=L;
 c.innerHTML=coach('Isso aí!','É aqui que você monta sua tela.',3);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{r.style.transition='stroke-dashoffset 3s linear';r.style.strokeDashoffset='0'}));
 clearTimeout(window._vt); window._vt=setTimeout(()=>{s.classList.add('down');c.innerHTML=coach('Primeiros passos','A lista volta para você continuar.',3)},3050);
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-v],[data-sub],[data-chip],[data-btab],[data-fav],#replay,[data-ring]'); if(!t) return;
 if(t.dataset.v){cur=t.dataset.v;sub=0;render()}
 else if(t.dataset.sub){sub=+t.dataset.sub;render()}
 else if(t.dataset.chip){if(t.dataset.chip==='all')showAll=!showAll;else labels=!labels;render()}
 else if(t.dataset.btab){bTab=+t.dataset.btab;render()}
 else if(t.dataset.fav){favCount=+t.dataset.fav;render()}
 else if(t.id==='replay') playVitrine();
 else if(t.dataset.ring){const a=t.querySelector('.arc');a.style.strokeDashoffset='0';const to=document.getElementById('toast-'+t.dataset.ring);setTimeout(()=>to&&to.classList.add('on'),150);setTimeout(()=>{a.style.strokeDashoffset=a.getAttribute('stroke-dasharray');to&&to.classList.remove('on')},1400)}
});
document.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-press]');if(t)t.classList.add('down')});
const up=e=>{document.querySelectorAll('.press.down').forEach(t=>{t.classList.remove('down');t.classList.add('rel');setTimeout(()=>t.classList.remove('rel'),450);const to=document.getElementById('toast-'+t.dataset.press);if(to){to.classList.add('on');setTimeout(()=>to.classList.remove('on'),1100)}})};
document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
render();
